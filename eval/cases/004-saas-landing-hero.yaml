id: "004-saas-landing-hero"
title: "SaaS 产品落地页 hero 区"
difficulty: easy
expected_strategy: HTML
tags:
  - landing
  - hero
  - cta

prompt: |
  做一个 AI 协作工具 Sparkly 的产品落地页 hero 区，标语"让团队像一个人一样思考"，
  下面一行简短副标题，两个 CTA 按钮：免费试用、查看演示。深色背景，渐变高光。

rubric:
  must_contain:
    - "Sparkly"
    - "让团队像一个人一样思考"
    - "免费试用"
    - "查看演示"
    - "viewport"
  must_not_contain:
    - "lorem ipsum"
    - "TODO"
    - "占位"
  llm_judge_dimensions:
    - "两个 CTA 视觉权重区分（主次清晰）"
    - "深色背景 + 渐变高光实际呈现"
    - "标语字号最大、位置居中或左上"

notes: |
  最小 hero 区。考察 Router 是否准确路由 HTML（短 prompt < 80 字、关键词"落地页"），
  以及生成是否能区分 primary / secondary CTA。常见失败：两个按钮风格一致没层级。
