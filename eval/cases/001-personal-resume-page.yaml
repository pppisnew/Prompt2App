id: "001-personal-resume-page"
title: "个人简历单页"
difficulty: easy
expected_strategy: HTML
tags:
  - landing
  - resume
  - typography

prompt: |
  做一个我的个人简历网页，姓名张三，Java 后端工程师，3 年经验，会 Spring Boot、MySQL、Redis。
  联系方式：zhangsan@example.com，电话 13800138000。要简洁专业。

rubric:
  must_contain:
    - "张三"
    - "Java"
    - "Spring Boot"
    - "zhangsan@example.com"
    - "viewport"               # responsive meta，体现移动端意识
  must_not_contain:
    - "lorem ipsum"
    - "TODO"
    - "占位"
  llm_judge_dimensions:
    - "信息层次清晰（姓名/技能/联系方式分区）"
    - "排版无溢出，字号/间距合理"
    - "颜色对比度足够，专业感"

notes: |
  最朴素的 HTML 单页 case。用来验证：
    1. Router 能否正确识别为 HTML 策略（< 100 字、关键词"网页/简历"）；
    2. 生成产物是否包含 prompt 中给的具体信息（不能丢字段）；
    3. 是否会无故引入复杂依赖（不应输出 Vue/React/构建工具）。
