# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
#
# 评测集 case schema 定义
# ---------------------------------------------------------------------------
# 每个 case 是一个 YAML 文件，命名 NNN-kebab-case.yaml，编号三位、单调递增。
# 字段说明见下方注释。所有字段都用客观事实描述，避免"很好/很差"等主观词。
# ---------------------------------------------------------------------------

$schema: "https://json-schema.org/draft/2026-6/schema"
$id: "Prompt2App/eval/case.schema.yaml"
title: "Evaluation Case"
type: object
required:
  - id
  - title
  - difficulty
  - expected_strategy
  - prompt
  - rubric
properties:

  id:
    type: string
    pattern: "^[0-9]{3}-[a-z0-9-]+$"
    description: "唯一编号，与文件名一致，如 001-personal-resume-page"

  title:
    type: string
    description: "case 一句话描述，便于报表展示"

  difficulty:
    type: string
    enum: [easy, medium, hard]
    description: |
      easy   - HTML 单文件即可（< 50 字 prompt）
      medium - MultiFile 多文件静态站（50-150 字）
      hard   - Vue 应用（含状态/交互，> 150 字 或 含交互词）

  expected_strategy:
    type: string
    enum: [HTML, MULTI_FILE, VUE_PROJECT]
    description: |
      期望 Router 选中的策略。如果实际命中其他策略，需要在 metric 中记录路由偏差。
      不是硬错误——但偏差率本身就是 Router 质量信号。

  tags:
    type: array
    items:
      type: string
    description: "用于切片分析，例如 landing/dashboard/form/animation/chart"

  prompt:
    type: string
    description: "用户输入的原始 prompt，原样喂给 Router/Agent"

  rubric:
    type: object
    description: "评分细则，三维评分依据"
    required:
      - must_contain
      - must_not_contain
    properties:

      must_contain:
        type: array
        items:
          type: string
        description: |
          产物中必须出现的元素/字符串/语义点（不区分大小写包含匹配）。
          每命中一项加一档分；缺失关键项 LLM-Judge 分上限被压制。
          例：["导航栏", "联系方式", "responsive viewport meta"]

      must_not_contain:
        type: array
        items:
          type: string
        description: |
          产物中绝对不该出现的反模式。命中即扣分。
          例：["lorem ipsum", "TODO", "<!-- placeholder -->"]

      llm_judge_dimensions:
        type: array
        items:
          type: string
        description: |
          LLM-as-Judge 打分时的关注维度提示词（仅作为 judge prompt 拼接素材，不做硬规则）。
          例：["视觉层次清晰", "交互完整", "无明显空白区域"]

      min_files:
        type: integer
        minimum: 1
        description: "产物文件数下限（仅 MULTI_FILE / VUE_PROJECT 必填）"

  baseline:
    type: object
    description: |
      重构前用现版项目跑出的基线，作为后续回归对比的锚点。
      首次运行后由 evaluator 自动写回。
    properties:
      compile_ok:
        type: boolean
      render_non_empty:
        type: boolean
      llm_judge_score:
        type: number
        minimum: 0
        maximum: 100
      duration_ms:
        type: integer
      token_input:
        type: integer
      token_output:
        type: integer
      cost_usd:
        type: number
      recorded_at:
        type: string
        format: date-time
      model:
        type: string
        description: "跑基线时使用的 LLM 模型名"

  notes:
    type: string
    description: "case 设计意图、来源（真实需求/竞品参考/边界测试）等备注"
