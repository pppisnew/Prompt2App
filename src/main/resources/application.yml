# =================================================================
# Prompt2App · 基础配置（不含敏感信息 / 部署变量）
# 配置外部化策略：ADR-0010
# 优先级：JVM -D > CLI -- > OS env > .env (spring-dotenv) > application-{profile}.yml > 本文件
# 所有可变值通过 ${VAR:default} 占位符引用环境变量；缺省值仅作为本地开发兜底，生产必须由 .env 或 OS env 注入
# =================================================================
spring:
  application:
    name: ${APP_NAME:Prompt2App-backend}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # session 配置
  session:
    store-type: redis
    timeout: ${SESSION_TIMEOUT:2592000}   # 默认 30 天
  # MySQL
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/prompt2app}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      ttl: ${REDIS_TTL:3600}              # 缓存过期（秒）

server:
  port: ${SERVER_PORT:8123}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api}
    session:
      cookie:
        max-age: ${SERVER_COOKIE_MAX_AGE:2592000}

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.prompt2app.app.controller

# knife4j
knife4j:
  enable: ${KNIFE4J_ENABLE:true}
  setting:
    language: zh_cn

# AI（LangChain4j）
langchain4j:
  open-ai:
    chat-model:
      base-url: ${LLM_CHAT_BASE_URL:https://api.deepseek.com}
      api-key: ${LLM_CHAT_API_KEY:}
      model-name: ${LLM_CHAT_MODEL:deepseek-chat}
      max-tokens: ${LLM_CHAT_MAX_TOKENS:8192}
      log-requests: ${LLM_CHAT_LOG_REQUESTS:true}
      log-responses: ${LLM_CHAT_LOG_RESPONSES:true}
      max-retries: ${LLM_CHAT_MAX_RETRIES:3}
    streaming-chat-model:
      base-url: ${LLM_STREAM_BASE_URL:https://api.deepseek.com}
      api-key: ${LLM_STREAM_API_KEY:}
      model-name: ${LLM_STREAM_MODEL:deepseek-chat}
      max-tokens: ${LLM_STREAM_MAX_TOKENS:8192}
      log-requests: ${LLM_STREAM_LOG_REQUESTS:true}
      log-responses: ${LLM_STREAM_LOG_RESPONSES:true}
    # 推理模型（复杂任务）
    reasoning-streaming-chat-model:
      base-url: ${LLM_REASONING_BASE_URL:https://api.deepseek.com}
      api-key: ${LLM_REASONING_API_KEY:}
      model-name: ${LLM_REASONING_MODEL:deepseek-reasoner}
      max-tokens: ${LLM_REASONING_MAX_TOKENS:32768}
      temperature: ${LLM_REASONING_TEMPERATURE:0.1}
      log-requests: ${LLM_REASONING_LOG_REQUESTS:true}
      log-responses: ${LLM_REASONING_LOG_RESPONSES:true}
    # 智能路由模型（轻量分类）
    routing-chat-model:
      base-url: ${LLM_ROUTING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${LLM_ROUTING_API_KEY:}
      model-name: ${LLM_ROUTING_MODEL:qwen-turbo}
      max-tokens: ${LLM_ROUTING_MAX_TOKENS:100}
      log-requests: ${LLM_ROUTING_LOG_REQUESTS:true}
      log-responses: ${LLM_ROUTING_LOG_RESPONSES:true}

# 腾讯云 COS 对象存储
cos:
  client:
    host: ${COS_HOST:}
    secretId: ${COS_SECRET_ID:}
    secretKey: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-shanghai}
    bucket: ${COS_BUCKET:}

# Pexels 图片搜索
pexels:
  api-key: ${PEXELS_API_KEY:}

# 阿里云 DashScope（图像生成）
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  image-model: ${DASHSCOPE_IMAGE_MODEL:wan2.2-t2i-flash}

# 部署路径（保持向后兼容：AppServiceImpl 仍读取 ${code.deploy-host}）
code:
  deploy-host: ${CODE_DEPLOY_HOST:http://localhost}

# Prompt2App 业务配置（ADR-0010）
prompt2app:
  storage:
    code-output-dir: ${PROMPT2APP_CODE_OUTPUT_DIR:${user.dir}/tmp/code_output}
    code-deploy-dir: ${PROMPT2APP_CODE_DEPLOY_DIR:${user.dir}/tmp/code_deploy}
    screenshots-dir: ${PROMPT2APP_SCREENSHOTS_DIR:${user.dir}/tmp/screenshots}
    code-deploy-host: ${PROMPT2APP_CODE_DEPLOY_HOST:${code.deploy-host}}
  tool:
    max-per-session: ${PROMPT2APP_TOOL_MAX_PER_SESSION:50}
    max-per-file: ${PROMPT2APP_TOOL_MAX_PER_FILE:10}

# 监控
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,prometheus}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_DETAILS:always}
